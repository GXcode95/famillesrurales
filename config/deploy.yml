# Name of your application. Used to uniquely configure containers.
service: familles_rurales

# Image sur GitHub Container Registry
# Doit rester en minuscules pour ghcr.io
image: gxcode95/famillesrurales

servers:
  web:
    - 164.132.197.2

# SSL désactivé tant que le DNS ne pointe pas vers le VPS.
# Quand les A @ et www → 164.132.197.2, remettre ssl: true
proxy:
  ssl: false
  hosts:
    - familles-rurales-ahuy.fr
    - www.familles-rurales-ahuy.fr
    - 164.132.197.2

# GitHub Container Registry
registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - SECRET_KEY_BASE
    - POSTGRES_PASSWORD
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
  clear:
    APP_HOST: familles-rurales-ahuy.fr
    CONTACT_EMAIL: xavier.grenouillet@gmail.com
    MAILER_FROM: noreply@familles-rurales-ahuy.fr
    DB_HOST: familles_rurales-db
    DB_NAME: familles_rurales_production
    DB_USER: familles_rurales
    AWS_REGION: eu-west-3
    AWS_BUCKET: familles-rurales-ahuy-bucket

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "familles_rurales_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64
  # Build sur le runner CI / Docker local (évite le builder SSH distant)

ssh:
  user: ubuntu

accessories:
  db:
    image: postgres:16
    host: 164.132.197.2
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: familles_rurales
        POSTGRES_DB: familles_rurales_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
